[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careiq-healthcare-operations"
version = "1.0.0"
description = "Synthetic healthcare operations and patient experience intelligence platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
  "shap>=0.46,<1",
  "plotly>=5.24,<7",
  "streamlit>=1.40,<2",
  "joblib>=1.4,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
careiq-bootstrap = "careiq.bootstrap:main"

[tool.setuptools.packages.find]
include = ["careiq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
